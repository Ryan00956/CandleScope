[package]
name = "candlescope-aho-corasick-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[dependencies]
aho-corasick = { version = "=1.1.4", default-features = false, features = ["perf-literal", "std"] }
candlescope-plugin-sdk = { package = "candlescope-plugin-sdk-wasm", path = "../../../packages/candlescope-plugin-sdk-rust-wasm" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
