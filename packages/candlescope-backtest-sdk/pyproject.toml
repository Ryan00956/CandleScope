[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "candlescope-backtest-sdk"
version = "0.1.0"
description = "Language-neutral author SDK for CandleScope Python strategies."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "CandleScope contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "hatchling>=1.25",
  "jsonschema>=4.23",
  "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/candlescope_backtest_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "src/candlescope_backtest_sdk",
  "fixtures",
  "templates",
  "goldens",
  "README.md",
  "README_zh.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
