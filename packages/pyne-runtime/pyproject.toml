[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyne-runtime"
version = "0.1.0"
description = "Pine-style Python indicator runtime for OHLCV data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "CandleScope contributors" }
]
keywords = ["technical-analysis", "indicators", "ohlcv", "pine-script", "trading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]
plot = ["matplotlib>=3"]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]
all = [
  "pandas>=2",
  "matplotlib>=3",
]

[project.scripts]
pyne = "pyne_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyne_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F821"]
